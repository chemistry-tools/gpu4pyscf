name: Mixed precision CPU checks

on:
  push:
    paths:
      - '.github/workflows/mixed_precision.yml'
      - 'gpu4pyscf/dft/*mixed*py'
      - 'gpu4pyscf/tools/ase_interface.py'
      - 'benchmarks/mixed_precision/**'
  pull_request:
    paths:
      - '.github/workflows/mixed_precision.yml'
      - 'gpu4pyscf/dft/*mixed*py'
      - 'gpu4pyscf/tools/ase_interface.py'
      - 'benchmarks/mixed_precision/**'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '4'
      OMP_THREAD_LIMIT: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: >-
          python -m pip install pyscf==2.14.0 ase==3.27.0 numpy==2.2.6
          pytest==9.1.1 ruff==0.16.10
      - name: Check precision code style
        run: >-
          ruff check --config .ruff.toml --select E4,E7,E9,F,I
          gpu4pyscf/dft/mixed_precision.py gpu4pyscf/dft/_mixed_grid.py
          gpu4pyscf/dft/_mixed_vv10.py gpu4pyscf/tools/ase_interface.py
          benchmarks/mixed_precision examples/dft/12-mixed_precision_ase.py
      - name: Test defaults, verification, recovery and calculator state without CUDA
        run: >-
          python -m pytest -p no:cacheprovider -q
          benchmarks/mixed_precision/test_ase_precision.py
          benchmarks/mixed_precision/test_experiments.py
          benchmarks/mixed_precision/test_compare_ase.py
